services:
  - type: web
    name: school-api
    runtime: node
    plan: free
    autoDeployTrigger: commit
    # preDeployCommand solo disponible en planes pagos (ver docs Render)
    # preDeployCommand: npm --workspace apps/api run prisma:migrate:deploy
    buildCommand: npm install && npm --workspace apps/api run prisma:generate && npm --workspace apps/api run prisma:migrate:deploy && npm --workspace apps/api run build
    startCommand: npm --workspace apps/api run start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: school-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: REFRESH_TOKEN_PEPPER
        sync: false
      - key: IP_GEO_ENABLED
        value: "false"
      - key: IP_GEO_ENDPOINT
        sync: false
      - key: IP_GEO_TIMEOUT_MS
        value: "800"
      - key: CACHE_METRICS_TOKEN
        sync: false
      - key: CACHE_WARM_ENABLED
        value: "false"
      - key: CACHE_WARM_BASE_URL
        sync: false
      - key: CACHE_WARM_TOKEN
        sync: false
      - key: CACHE_WARM_TIMEOUT_MS
        value: "4000"
      - key: CACHE_WARM_WORKER_ENABLED
        value: "false"
      - key: RATE_LIMIT_METRICS_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://school-platform-web.onrender.com
      - key: TRUST_PROXY
        value: "true"
      - key: NOTIFICATION_WORKER_ENABLED
        value: "true"
      - key: EMAIL_WORKER_ENABLED
        value: "true"
      - key: ADMIN_2FA_ENABLED
        value: "true"
      - key: TWO_FACTOR_ROLES
        value: "ADMIN,TEACHER,PARENT"
      - key: SMTP_HOST
        value: smtp.yourprovider.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Colegio <no-reply@colegio.edu>
  - type: web
    name: school-web
    runtime: static
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm install && npm --workspace apps/web run build
    staticPublishPath: apps/web/dist
    routes:
      - type: header
        source: "/assets/*"
        headers:
          - key: Cache-Control
            value: "public, max-age=31536000, immutable"
      - type: header
        source: "/index.html"
        headers:
          - key: Cache-Control
            value: "no-store, no-cache, must-revalidate, max-age=0"
          - key: Pragma
            value: "no-cache"
          - key: Expires
            value: "0"
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: https://school-platform-z8f4.onrender.com/api

databases:
  - name: school-db
    plan: free
    databaseName: school_platform
    user: school_platform
