services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - school_net

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - school_net

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-true}
      EMAIL_WORKER_ENABLED: ${EMAIL_WORKER_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SCHOOL_NAME: ${SCHOOL_NAME}
    command: ["sh", "-c", "npm --workspace apps/api run prisma:migrate:deploy && npm --workspace apps/api run start"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/ready | grep -q '\"ok\":true'"]
      interval: 15s
      timeout: 5s
      retries: 20
    volumes:
      - api_runtime:/app/apps/api/.runtime
    networks:
      - school_net

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health | grep -q '\"ok\":true'"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - school_net

networks:
  school_net:
    driver: bridge

volumes:
  db_data:
  redis_data:
  api_runtime:
