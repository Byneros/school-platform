# ============================================
# NGINX Edge SSL - Multi colegio por subdominio
# Archivo generado automaticamente por:
#   scripts/generate-nginx-multi.mjs
# NO editar manualmente: regenera desde el mapping JSON.
# ============================================

# -------- colegio-a (HTTP -> HTTPS + ACME) --------
server {
  listen 80;
  server_name colegio-a.tudominio.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# -------- colegio-a (HTTPS) --------
server {
  listen 443 ssl http2;
  server_name colegio-a.tudominio.com;

  ssl_certificate /etc/letsencrypt/live/colegio-a.tudominio.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/colegio-a.tudominio.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_prefer_server_ciphers off;

  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

